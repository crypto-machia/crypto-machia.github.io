---
layout: default
title: ""
---
<section class="intro">
  <p>{{ site.description }}</p>
</section>

{% assign tag_names = site.tags | sort %}
{% if tag_names.size > 0 %}
<div class="tag-filter">
  <button type="button" class="tag-btn active" data-tag="all">all</button>
  {% for tag in tag_names %}
  <button type="button" class="tag-btn" data-tag="{{ tag[0] | slugify }}">{{ tag[0] }}</button>
  {% endfor %}
</div>
{% endif %}

<ul class="post-list">
  {% for post in site.posts %}
  <li data-tags="{% for tag in post.tags %}{{ tag | slugify }} {% endfor %}">
    <a href="{{ post.url | relative_url }}">{{ post.title }}</a>
    <time datetime="{{ post.date | date_to_xmlschema }}">{{ post.date | date: "%b %-d, %Y" }}</time>
  </li>
  {% endfor %}
</ul>

<script>
  document.querySelectorAll('.tag-btn').forEach(function (btn) {
    btn.addEventListener('click', function () {
      document.querySelector('.tag-btn.active').classList.remove('active');
      btn.classList.add('active');
      var tag = btn.dataset.tag;
      document.querySelectorAll('.post-list li').forEach(function (li) {
        var tags = li.dataset.tags.trim().split(' ');
        li.style.display = (tag === 'all' || tags.indexOf(tag) !== -1) ? '' : 'none';
      });
    });
  });
</script>
